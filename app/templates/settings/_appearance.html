<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6"
     x-data="{ theme: (window.vsGetThemePreference && window.vsGetThemePreference()) || 'auto' }">
  <h2 class="text-lg font-semibold text-slate-900 dark:text-slate-100 mb-1">Appearance</h2>
  <p class="text-sm text-slate-500 dark:text-slate-400 mb-5">Choose how VidSense looks. Auto matches your device light or dark mode.</p>

  <div class="inline-flex rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 p-1 gap-1">
    <button type="button"
            @click="theme = 'light'; window.vsSetThemePreference && window.vsSetThemePreference('light')"
            class="flex items-center gap-1.5 px-4 py-2 text-sm font-medium rounded-md transition-all"
            :class="theme === 'light'
              ? 'bg-white text-slate-900 shadow-sm'
              : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <span>Light</span>
    </button>

    <button type="button"
            @click="theme = 'dark'; window.vsSetThemePreference && window.vsSetThemePreference('dark')"
            class="flex items-center gap-1.5 px-4 py-2 text-sm font-medium rounded-md transition-all"
            :class="theme === 'dark'
              ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 shadow-sm'
              : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      <span>Dark</span>
    </button>

    <button type="button"
            @click="theme = 'auto'; window.vsSetThemePreference && window.vsSetThemePreference('auto')"
            class="flex items-center gap-1.5 px-4 py-2 text-sm font-medium rounded-md transition-all"
            :class="theme === 'auto'
              ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 shadow-sm'
              : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
      <span>Auto</span>
    </button>
  </div>
</div>
