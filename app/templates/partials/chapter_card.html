<div
  class="chapter-card group border border-slate-200 rounded-xl bg-white hover:border-brand-300 hover:shadow-sm transition-all"
  data-start="{{ chapter.start_time_sec }}"
  data-end="{{ chapter.end_time_sec }}"
  id="chapter-{{ chapter.chapter_id }}"
  x-data="{ expanded: false }"
>
  <!-- Card header: timestamp + title -->
  <div class="flex items-start gap-3 p-4">
    <button
      onclick="seekVideo({{ chapter.start_time_sec }})"
      class="flex-shrink-0 font-mono text-xs font-semibold text-brand-600 hover:text-brand-800 bg-brand-50 hover:bg-brand-100 border border-brand-200 rounded-md px-2 py-1 transition-colors mt-0.5 focus:outline-none focus:ring-2 focus:ring-brand-400"
      title="Jump to {{ chapter.start_display }}"
    >{{ chapter.start_display }}</button>
    <div class="flex-1 min-w-0">
      <h3 class="font-semibold text-slate-900 text-sm leading-snug">{{ chapter.title }}</h3>
      <p class="text-slate-500 text-xs mt-1 leading-relaxed">{{ chapter.summary }}</p>
    </div>
  </div>

  <!-- Key points -->
  {% if chapter.key_points %}
  <div class="px-4 pb-3 pt-0">
    <ul class="space-y-1">
      {% for point in chapter.key_points %}
      <li class="flex items-start gap-2 text-xs text-slate-600">
        <span class="mt-1.5 w-1 h-1 rounded-full bg-slate-300 flex-shrink-0"></span>
        <span>{{ point }}</span>
      </li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}

  <!-- Expandable transcript segment -->
  <div class="border-t border-slate-100 px-4">
    <button
      @click="expanded = !expanded"
      class="flex items-center gap-1 text-xs text-slate-400 hover:text-slate-600 py-2 transition-colors focus:outline-none"
    >
      <svg
        class="w-3.5 h-3.5 transition-transform"
        :class="{ 'rotate-90': expanded }"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
      <span x-text="expanded ? 'Hide transcript' : 'Show transcript'"></span>
    </button>
    <div x-show="expanded" x-cloak class="pb-4">
      <p class="text-xs text-slate-500 leading-relaxed font-mono bg-slate-50 rounded-lg px-3 py-2 whitespace-pre-wrap">{{ chapter.transcript_segment }}</p>
    </div>
  </div>
</div>
