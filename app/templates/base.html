<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}VidSense{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230284c7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M15 10l4.553-2.07A1 1 0 0121 8.878V15.12a1 1 0 01-1.447.91L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z'/></svg>" />

  <!--
    Theme API (light | dark | auto)
    Inline in <head> so helpers are available BEFORE Alpine evaluates x-data
    and the dark class is applied BEFORE first paint (no FOUC).
  -->
  <script>
    (function () {
      var STORAGE_KEY = 'vidsense-theme';
      var VALID = ['light', 'dark', 'auto'];
      var listeners = [];

      function normalize(raw) {
        if (raw === 'system') return 'auto';
        return VALID.indexOf(raw) !== -1 ? raw : 'auto';
      }
      function resolved(pref) {
        if (pref === 'auto') {
          return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        return pref;
      }
      function apply() {
        var r = resolved(window.vsGetThemePreference());
        document.documentElement.classList.toggle('dark', r === 'dark');
        for (var i = 0; i < listeners.length; i++) {
          try { listeners[i](r); } catch (e) { /* ignore */ }
        }
      }

      window.vsGetThemePreference = function () {
        return normalize(localStorage.getItem(STORAGE_KEY));
      };
      window.vsSetThemePreference = function (v) {
        v = normalize(v);
        localStorage.setItem(STORAGE_KEY, v);
        apply();
      };
      window.vsGetResolvedTheme = function () {
        return resolved(window.vsGetThemePreference());
      };
      window.vsApplyThemeFromPreference = apply;
      window.vsOnThemeChange = function (fn) {
        if (typeof fn === 'function') listeners.push(fn);
      };
      window.vsOffThemeChange = function (fn) {
        if (typeof fn !== 'function') return;
        for (var i = listeners.length - 1; i >= 0; i--) {
          if (listeners[i] === fn) listeners.splice(i, 1);
        }
      };

      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        if (window.vsGetThemePreference() === 'auto') apply();
      });

      // Apply once, pre-paint, to avoid FOUC.
      document.documentElement.classList.toggle(
        'dark',
        resolved(window.vsGetThemePreference()) === 'dark'
      );
    })();
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>

  <!-- Alpine.js (collapse plugin must load before core) -->
  <script src="https://unpkg.com/@alpinejs/collapse@3.14.3/dist/cdn.min.js" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js" defer></script>

  <!-- Cytoscape.js (mind map visualization) -->
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js" defer></script>

  <!-- Markdown + sanitization (Ask tab assistant messages) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js" defer></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="/static/css/app.css" />

  {% block head %}{% endblock %}
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased" x-data>

  <!-- Nav -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center gap-3">

      <!-- Logo / back-nav -->
      {% block nav_left %}
      <a href="/" class="flex items-center gap-2 font-bold text-brand-700 dark:text-brand-400 text-lg tracking-tight hover:text-brand-600 dark:hover:text-brand-300 transition-colors shrink-0">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.07A1 1 0 0121 8.878V15.12a1 1 0 01-1.447.91L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z" />
        </svg>
        VidSense
      </a>
      {% endblock %}

      <!-- Breadcrumb / page-specific nav extras -->
      {% block nav_breadcrumb %}{% endblock %}

      <!-- Right side nav actions -->
      <div class="ml-auto flex items-center gap-3">
        {% block nav_right %}
        <a href="/settings" class="flex items-center gap-1.5 text-sm text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 transition-colors font-medium" title="Settings">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span class="hidden sm:inline">Settings</span>
        </a>
        {% endblock %}
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="{% block main_class %}max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <!-- App JS -->
  <script src="/static/js/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
