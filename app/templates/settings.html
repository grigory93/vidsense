{% extends "base.html" %}

{% block title %}Settings — VidSense{% endblock %}

{% block nav_breadcrumb %}
<div class="flex items-center gap-1.5 text-sm">
  <svg class="w-3.5 h-3.5 shrink-0 text-slate-400 dark:text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
  </svg>
  <span class="text-slate-800 dark:text-slate-200 font-semibold text-base">Settings</span>
</div>
{% endblock %}

{% block nav_right %}
<a href="/"
   onclick="if (history.length > 1) { history.back(); return false; }"
   class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium rounded-md bg-brand-600 text-white hover:bg-brand-700 transition-colors"
   title="Back to previous page">
  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
  </svg>
  <span>Done</span>
</a>
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-8">

  <div>
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-1">Settings</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400">Customize your VidSense experience.</p>
  </div>

  {% include "settings/_appearance.html" %}

</div>
{% endblock %}
